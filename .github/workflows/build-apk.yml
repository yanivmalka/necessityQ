name: Build APK

# The APK: signed release build and a GitHub Release. Started by hand:
# Actions → "Build APK" → "Run workflow" (on main, to publish a release).
# The domain unit tests are not run here: "Android CI/CD" runs them on every push and PR, before this build.
# Lint: assembleRelease always runs the fatal checks (lintVital), which fail the build on errors that would break
# the app. The full lint report takes about a minute more, so it runs only when "full_lint" is ticked.
on:
  workflow_dispatch:
    inputs:
      full_lint:
        description: "Full lint report (about a minute longer)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The version (versionCode and the vMAJOR.MINOR.N tag; MAJOR.MINOR is in version.txt): this workflow's run number + 200, above every release built
      # by the old "Android CI/CD" workflow (its run numbers are below 200), so each new APK installs over the
      # previous one and the in-app update check sees it as newer. The app build reads VERSION_CODE.
      - name: Version
        run: echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 200))" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Optional: shared realtime mode. Without the secret the app is built in single-device mode.
      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Firebase: configured"
          else
            echo "Firebase: not configured (single-device build)"
          fi

      # Optional: production signing key. Without it the committed dev keystore is used.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.keystore
            echo "SIGNING_STORE_FILE=keystore/release.keystore" >> "$GITHUB_ENV"
            echo "RELEASE_SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 is not set: this APK is signed with the public dev keystore and will not be published as a release."
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          FULL_LINT: ${{ inputs.full_lint }}
        run: |
          if [ "$FULL_LINT" = "true" ]; then
            ./gradlew :app:lintRelease :app:assembleRelease --stacktrace
          else
            ./gradlew :app:assembleRelease --stacktrace
          fi

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk necessityQ-${{ env.VERSION_CODE }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: necessityQ-apk
          path: necessityQ-${{ env.VERSION_CODE }}.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: app/build/reports/lint-results-release*.html
          if-no-files-found: ignore

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Never publish an APK signed with the committed (public) dev keystore.
          if [ "$RELEASE_SIGNED" != "true" ]; then
            echo "::error::Refusing to publish a release signed with the dev keystore. Set KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS and SIGNING_KEY_PASSWORD in the repository secrets."
            exit 1
          fi
          TAG="v$(tr -d '[:space:]' < version.txt).${{ env.VERSION_CODE }}"
          gh release create "$TAG" "necessityQ-${{ env.VERSION_CODE }}.apk" \
            --title "necessityQ $TAG" \
            --notes "בנייה אוטומטית מ-${GITHUB_SHA::7}. להתקנה: הורידו את קובץ ה-APK בטלפון ופתחו אותו." \
            --latest
