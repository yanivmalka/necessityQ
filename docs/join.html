<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הצטרפות לבית ב-necessityQ</title>
<style>
  :root { --bg: #f6f7f2; --ink: #1d2a1f; --muted: #5b6b5e; --accent: #2e7d32; --card: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121512; --ink: #e8efe6; --muted: #a7b5a6; --accent: #81c784; --card: #1c211c; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 system-ui, sans-serif; }
  main { max-width: 440px; margin: 0 auto; padding: 32px 16px; }
  .card { background: var(--card); border-radius: 20px; padding: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 8px 0; }
  .code { font-size: 32px; font-weight: 700; letter-spacing: 4px; color: var(--ink); direction: ltr; text-align: center; margin: 16px 0; }
  a.button { display: block; text-align: center; background: var(--accent); color: #fff; text-decoration: none;
             font-weight: 600; padding: 14px; border-radius: 14px; margin-top: 16px; }
  a.link { color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>הוזמנתם לרשימת קניות משותפת</h1>
    <p>נגיעה בכפתור פותחת את necessityQ ומצטרפת לבית.</p>
    <div class="code" id="code">——</div>
    <a class="button" id="open" href="#">פתיחה באפליקציה</a>
    <p>לא נפתח? פתחו את האפליקציה ובחרו "הצטרפות לבית" עם הקוד שלמעלה.</p>
    <p>אין עדיין את האפליקציה? <a class="link" href="https://github.com/yanivmalka/necessityQ/releases/latest">להורדה</a>.</p>
  </div>
</main>
<script>
  // only a plain code is passed on (letters and digits), and it is shown as text
  var raw = new URLSearchParams(location.search).get("code") || "";
  var code = /^[A-Za-z0-9]{4,12}$/.test(raw) ? raw.toUpperCase() : "";
  var open = document.getElementById("open");
  if (code) {
    document.getElementById("code").textContent = code;
    var fallback = encodeURIComponent("https://github.com/yanivmalka/necessityQ/releases/latest");
    var target = /Android/i.test(navigator.userAgent)
      ? "intent://join?code=" + code + "#Intent;scheme=necessityq;S.browser_fallback_url=" + fallback + ";end"
      : "necessityq://join?code=" + code;
    open.href = target;
    // try once by itself; the button stays for browsers that wait for a tap
    setTimeout(function () { location.href = target; }, 300);
  } else {
    document.getElementById("code").textContent = "הקוד חסר בקישור";
    open.style.display = "none";
  }
</script>
</body>
</html>
